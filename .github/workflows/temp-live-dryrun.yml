name: TEMP live dry-run (will be removed)
on:
  push:
    paths:
      - ".github/workflows/temp-live-dryrun.yml"
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: ตรวจกับข้อมูลจริง (ไม่ส่ง LINE) แล้วบันทึกผล
        run: python .github/temp-live-dryrun.py | tee /tmp/report.txt
      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp /tmp/report.txt state/dryrun-report.txt
          git add state/dryrun-report.txt
          git commit -m "TEMP: live dry-run report (will be removed)"
          git push
