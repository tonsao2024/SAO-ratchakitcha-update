# TEMPORARY — วิเคราะห์ข้อมูลจริงเพื่อตั้งค่าเริ่มต้น STALE_DAYS แล้วจะลบออก
name: TEMP HF dry-run test
on:
  push:
    branches: [arena/01a0d208-sao-ratchakitcha-update]
    paths: [".github/workflows/tmp-hf-dryrun.yml"]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Publish-date gaps + SAO hits per month (2024-01 … 2026-09)
        run: |
          python - <<'EOF' 2>&1 | tee out.txt
          import collections, check_ratchakitcha as c
          from datetime import date
          kws = c.load_keywords(); nk = [c.norm(k) for k in kws]
          dates, hits = set(), collections.Counter()
          for y, m in c.months_between(date(2024, 1, 1), date(2026, 9, 1)):
              body = c.http_get(c.meta_url(y, m))
              if body is None: print("missing", y, m); continue
              rows, _ = c.parse_jsonl(body)
              for r in rows:
                  it = c.to_item(r)
                  if it["is_test"] or not it["date"] or it["date"] < date(2024, 1, 1): continue
                  dates.add(it["date"])
                  if any(k in c.norm(it["title"]) for k in nk):
                      hits[it["date"].strftime("%Y-%m")] += 1
          ds = sorted(d for d in dates if d <= date(2026, 9, 24))
          gaps = sorted(((b - a).days, a, b) for a, b in zip(ds, ds[1:]))[::-1][:12]
          print("distinct publish dates:", len(ds), ds[0], "→", ds[-1])
          print("largest gaps (days between consecutive publish dates):")
          for g, a, b in gaps: print(f"  {g}d  {a} ({a:%a}) → {b} ({b:%a})")
          wd = collections.Counter(d.strftime("%a") for d in ds)
          print("publish days by weekday:", dict(wd))
          print("SAO keyword hits per month:", dict(sorted(hits.items())))
          print("total hits:", sum(hits.values()))
          EOF
      - name: Publish log as annotation
        if: always()
        run: |
          python - <<'EOF'
          t = open("out.txt", encoding="utf-8").read()[-3500:]
          print("::notice title=analysis::" + t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          EOF
