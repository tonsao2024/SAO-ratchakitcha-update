name: Ratchakitcha SAO alert
on:
  schedule:
    - cron: "0 2 * * *"   # 09:00 น. เวลาไทย
    - cron: "0 11 * * *"  # 18:00 น. เวลาไทย
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python check_ratchakitcha.py
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "update seen state" && git push
